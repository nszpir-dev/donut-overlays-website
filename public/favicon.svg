<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Donut Overlays tab icon.
       Drawn as a thick stroked circle rather than two filled circles, so the
       hole stays a real hole at every size. The ring is deliberately thinner
       than looks right at full size: at 16 pixels a fat ring closes up and
       the donut turns into a green blob. Three chunky sprinkles, sitting on
       the middle of the band — a dozen fine ones read as mush that small. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6affa8"/>
      <stop offset=".55" stop-color="#2ee66b"/>
      <stop offset="1" stop-color="#19e3c8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b1424"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="url(#g)" stroke-width="11"/>
  <g stroke="#ffc93c" stroke-width="4" stroke-linecap="round">
    <line x1="20.1" y1="19.3" x2="16.1" y2="25.1"/>
    <line x1="49.1" y1="29.5" x2="46.7" y2="22.9"/>
    <line x1="25.6" y1="48.1" x2="32.4" y2="49.3"/>
  </g>
</svg>
